<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQ ICON · App Store 高清图标下载器</title>
<meta name="description" content="高质量 App Store 图标下载器，支持 iOS / iPadOS / macOS，多种地区、样式、格式与尺寸。">
<meta property="og:title" content="HQ ICON · App Store 高清图标下载器">
<meta property="og:description" content="高质量 App Store 图标下载器，支持 iOS / iPadOS / macOS，多种地区、样式、格式与尺寸。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3EHQ%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f17;
    --bg2:#111726;
    --panel:#141b2d;
    --panel2:#1a2338;
    --border:rgba(148,163,184,.14);
    --text:#e8edf6;
    --text2:#93a1b8;
    --text3:#5d6b84;
    --accent:#3b82f6;
    --accent2:#a855f7;
    --ok:#22c55e;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-gutter:stable}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(1000px 500px at 90% -10%, rgba(168,85,247,.13), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* Header */
  header{padding:34px 0 6px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:52px;height:52px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,#3b82f6,#a855f7);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;letter-spacing:.5px;color:#fff;
    box-shadow:0 8px 24px rgba(99,102,241,.35);
  }
  .brand h1{font-size:24px;font-weight:800;letter-spacing:.3px}
  .brand p{color:var(--text2);font-size:13px;margin-top:2px}
  .brand .cnt{margin-left:auto;text-align:right;color:var(--text3);font-size:13px}
  .brand .cnt b{display:block;font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}

  /* Controls */
  .controls{
    margin-top:24px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;
    box-shadow:var(--shadow);
  }
  .search-row{display:flex;gap:10px}
  .search-row input{
    flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:11px 14px;font-size:15px;outline:none;transition:border .15s;
  }
  .search-row input:focus{border-color:var(--accent)}
  .search-row input::placeholder{color:var(--text3)}
  .search-row button{
    background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;
    padding:0 26px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
    transition:filter .15s,transform .05s;
  }
  .search-row button:hover{filter:brightness(1.12)}
  .search-row button:active{transform:scale(.98)}

  .controls-row{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
  .ctl{display:flex;align-items:center;gap:10px}
  .ctl .label{color:var(--text2);font-size:13px;flex:none;min-width:34px}

  .seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{
    border:none;background:transparent;color:var(--text2);font-size:13px;
    padding:6px 12px;border-radius:8px;cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .seg button:hover{color:var(--text)}
  .seg button.on{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:600}
  select.ctl-sel{
    background:var(--bg2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:7px 10px;font-size:13px;outline:none;cursor:pointer;
  }

  /* Status & grid */
  .status{display:flex;align-items:center;gap:10px;margin:20px 2px 12px;color:var(--text2);font-size:13px;min-height:20px}
  .spinner{
    width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;display:none;
  }
  .spinner.on{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px;padding-bottom:60px}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:rgba(148,163,184,.3)}
  .icon-box{padding:16px 16px 0}
  .icon-box img{
    width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff;
    border:1px solid rgba(255,255,255,.07);
  }
  /* Style masks */
  .st-official img{border-radius:22.5%}
  .st-normal img{border-radius:12%}
  .st-rounded img{border-radius:32%}
  .st-original img{border-radius:0}
  .info{padding:12px 14px 6px;flex:1;min-width:0}
  .info h3{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .artist{color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .info .meta{color:var(--text3);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{display:flex;gap:8px;padding:10px 12px 14px}
  .actions .btn-dl{
    flex:1;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;
    padding:8px 0;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s;
  }
  .actions .btn-dl:hover{filter:brightness(1.12)}
  .actions .btn-link{
    flex:none;background:var(--panel2);border:1px solid var(--border);color:var(--text2);
    text-decoration:none;padding:8px 12px;border-radius:9px;font-size:12px;transition:all .15s;
  }
  .actions .btn-link:hover{color:var(--text);border-color:rgba(148,163,184,.4)}

  .empty{
    text-align:center;color:var(--text3);padding:70px 20px;font-size:14px;
    border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty b{display:block;font-size:34px;margin-bottom:10px;opacity:.7}

  /* Toast */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:#1a2338;border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:all .25s;box-shadow:var(--shadow);z-index:99;max-width:80vw;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--border);padding:22px 0 34px;color:var(--text3);font-size:12px;text-align:center}
  footer a{color:var(--text2);text-decoration:none}
  footer a:hover{color:var(--accent)}

  @media (max-width:640px){
    .brand .cnt{display:none}
    .controls-row{gap:12px}
    .search-row button{padding:0 18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">HQ</div>
      <div>
        <h1>HQ ICON</h1>
        <p>High-quality App Store icon downloader</p>
      </div>
      <div class="cnt"><b id="total">–</b><span>结果</span></div>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="search-row">
        <input id="term" type="search" placeholder="搜索 App，例如：微信、Telegram、Notion…" autocomplete="off">
        <button id="go">搜索</button>
      </div>
      <div class="controls-row">
        <div class="ctl">
          <span class="label">平台</span>
          <div class="seg" id="platform-seg" role="group" aria-label="平台"></div>
        </div>
        <div class="ctl">
          <span class="label">地区</span>
          <select id="region" class="ctl-sel" aria-label="地区"></select>
        </div>
        <div class="ctl">
          <span class="label">样式</span>
          <div class="seg" id="style-seg" role="group" aria-label="样式"></div>
        </div>
        <div class="ctl">
          <span class="label">格式</span>
          <div class="seg" id="format-seg" role="group" aria-label="格式"></div>
        </div>
        <div class="ctl">
          <span class="label">尺寸</span>
          <div class="seg" id="size-seg" role="group" aria-label="尺寸"></div>
        </div>
      </div>
    </section>

    <div class="status">
      <span class="spinner" id="spinner"></span>
      <span id="status-text">输入关键词开始搜索</span>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    数据来自 <a href="https://developer.apple.com/library/archive/documentation/AudioVideo/Conceptual/iTuneSearchAPI/index.html" target="_blank" rel="noopener">Apple iTunes Search API</a>，图标版权归各开发者所有，仅供个人学习使用。
  </footer>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  var state = {
    term: '微信',
    platform: 'software',
    region: 'CN',
    style: 'official',
    format: 'png',
    size: 512
  };

  var REGIONS = [
    ['CN','中国大陆'],['US','美国'],['JP','日本'],['KR','韩国'],['TW','中国台湾'],
    ['HK','中国香港'],['SG','新加坡'],['GB','英国'],['FR','法国'],['DE','德国'],
    ['IT','意大利'],['ES','西班牙'],['RU','俄罗斯'],['IN','印度'],['TH','泰国'],
    ['ID','印度尼西亚'],['PH','菲律宾']
  ];
  var PLATFORMS = [['software','iOS'],['ipadSoftware','iPadOS'],['macSoftware','macOS']];
  var STYLES = [['official','官方'],['normal','常规'],['rounded','圆角'],['original','原始']];
  var FORMATS = [['jpg','JPEG'],['png','PNG'],['webp','WebP']];
  var SIZES = [256,512,1024];

  var $ = function(s, el){ return (el || document).querySelector(s); };
  var termEl = $('#term'), goEl = $('#go'), gridEl = $('#grid'),
      statusEl = $('#status-text'), spinnerEl = $('#spinner'),
      totalEl = $('#total'), toastEl = $('#toast');

  var currentResults = [];

  /* ---------- build segmented controls ---------- */
  function buildSeg(containerId, list, key, onChange){
    var box = $('#' + containerId);
    list.forEach(function(item){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = item[1];
      btn.dataset.value = item[0];
      if (item[0] === state[key]) btn.classList.add('on');
      btn.addEventListener('click', function(){
        state[key] = item[0];
        box.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        onChange && onChange(key);
      });
      box.appendChild(btn);
    });
  }

  function buildRegion(){
    var sel = $('#region');
    REGIONS.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r[0];
      opt.textContent = r[1] + ' (' + r[0] + ')';
      sel.appendChild(opt);
    });
    sel.value = state.region;
    sel.addEventListener('change', function(){ state.region = sel.value; runSearch(); });
  }

  /* ---------- helpers ---------- */
  function artworkUrl(url, size, format){
    if (!url) return '';
    var ext = (format === 'webp') ? 'webp' : format;
    return url.replace(/(\/\d+x\d+)(?:bb)?\.(?:jpg|png|webp)/i, '/' + size + 'x' + size + 'bb.' + ext);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function sanitizeName(s){
    return String(s).replace(/[\\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'icon';
  }

  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function setLoading(on){
    spinnerEl.classList.toggle('on', on);
  }

  /* ---------- download ---------- */
  function downloadIcon(url, filename){
    fetch(url, { mode: 'cors', credentials: 'omit' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function(blob){
        var objectUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 4000);
        toast('已开始下载 ' + filename);
      })
      .catch(function(){
        toast('直接下载失败，已在新窗口打开原图');
        window.open(url, '_blank', 'noopener');
      });
  }

  /* ---------- render ---------- */
  function renderGrid(results){
    currentResults = results;
    totalEl.textContent = results.length;
    if (!results.length){
      gridEl.innerHTML = '<div class="empty"><b>⌕</b>没有找到相关 App，换个关键词试试</div>';
      return;
    }
    var html = results.map(function(r){
      var name = esc(r.trackName || '未知 App');
      var artist = esc(r.artistName || '');
      var genre = esc(r.primaryGenreName || '');
      var rating = r.averageUserRating ? '★ ' + Number(r.averageUserRating).toFixed(1) : '';
      var meta = [genre, rating].filter(Boolean).join(' · ');
      var preview = artworkUrl(r.artworkUrl100 || r.artworkUrl512, 256, 'jpg');
      var full = artworkUrl(r.artworkUrl100 || r.artworkUrl512, state.size, state.format);
      var file = sanitizeName(r.trackName) + '-' + state.size + 'px.' + state.format;
      var link = r.trackViewUrl ? ' href="' + esc(r.trackViewUrl) + '" target="_blank" rel="noopener"' : '';
      return '' +
        '<article class="card">' +
          '<div class="icon-box st-' + state.style + '"><img loading="lazy" src="' + preview + '" alt="' + name + '"></div>' +
          '<div class="info">' +
            '<h3 title="' + name + '">' + name + '</h3>' +
            '<p class="artist" title="' + artist + '">' + artist + '</p>' +
            '<p class="meta">' + (meta || '&nbsp;') + '</p>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn-dl" type="button" data-url="' + esc(full) + '" data-file="' + esc(file) + '">下载</button>' +
            '<a class="btn-link"' + link + '>商店</a>' +
          '</div>' +
        '</article>';
    }).join('');
    gridEl.innerHTML = html;
  }

  function onDownloadClick(e){
    var btn = e.target.closest('.btn-dl');
    if (!btn) return;
    downloadIcon(btn.dataset.url, btn.dataset.file);
  }

  /* ---------- search ---------- */
  function runSearch(){
    var term = termEl.value.trim();
    if (!term){ toast('请输入关键词'); return; }
    state.term = term;
    setLoading(true);
    statusEl.textContent = '正在搜索「' + term + '」…';

    var q = new URLSearchParams({
      term: term,
      country: state.region,
      entity: state.platform,
      media: 'software',
      limit: '50'
    });

    fetch('https://itunes.apple.com/search?' + q.toString(), { mode: 'cors' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var results = (data.results || []).filter(function(r){ return r.artworkUrl100 || r.artworkUrl512; });
        statusEl.textContent = '找到 ' + data.resultCount + ' 个结果，展示前 ' + results.length + ' 个';
        renderGrid(results);
      })
      .catch(function(err){
        console.error(err);
        statusEl.textContent = '搜索失败，请检查网络后重试';
        gridEl.innerHTML = '';
        totalEl.textContent = '–';
      })
      .finally(function(){ setLoading(false); });
  }

  /* ---------- init ---------- */
  buildSeg('platform-seg', PLATFORMS, 'platform', function(key){
    if (key === 'platform') runSearch();
  });
  buildRegion();
  buildSeg('style-seg', STYLES, 'style', function(){ renderGrid(currentResults); });
  buildSeg('format-seg', FORMATS, 'format', function(){ renderGrid(currentResults); });
  buildSeg('size-seg', SIZES, 'size', function(){ renderGrid(currentResults); });

  termEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') runSearch();
  });
  goEl.addEventListener('click', runSearch);
  gridEl.addEventListener('click', onDownloadClick);

  termEl.value = state.term;
  runSearch();
})();
</script>
</body>
</html>
