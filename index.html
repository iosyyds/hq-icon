    border-radius:26px;overflow:hidden;position:relative;display:flex;flex-direction:column;

    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  }
  .sk::after{
    content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    animation:shimmer 1.3s infinite;
  }
  @keyframes shimmer{to{transform:translateX(100%)}}
  .sk .s-ic{margin:17px 17px 0;aspect-ratio:1;border-radius:22%;background:rgba(255,255,255,.45)}
  .sk .s-l1{height:12px;margin:15px 16px 0;border-radius:6px;background:rgba(255,255,255,.4);width:72%}
  .sk .s-l2{height:10px;margin:9px 16px 0;border-radius:6px;background:rgba(255,255,255,.3);width:50%}
  .sk .s-btn{height:38px;margin:15px 14px 16px;border-radius:14px;background:rgba(47,107,255,.28)}

  .empty{
    grid-column:1/-1;text-align:center;padding:84px 24px;border-radius:30px;
    background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
    border:1px dashed rgba(255,255,255,.7);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8);
    color:var(--ink2);font-size:14px;font-weight:500;
  }
  .empty .em{
    width:92px;height:92px;margin:0 auto 20px;border-radius:30px;display:flex;align-items:center;justify-content:center;
    font-size:42px;
    background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(255,255,255,.3));
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 16px 40px rgba(31,38,135,.28),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 24px rgba(255,255,255,.25);
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

  /* ================= toast / top ================= */
  #toast{
    position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(26px);
    background:linear-gradient(150deg,rgba(255,255,255,.85),rgba(255,255,255,.6));
    border:1px solid rgba(255,255,255,.85);color:var(--ink);
    padding:13px 22px;border-radius:16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .35s cubic-bezier(.22,.61,.36,1);
    box-shadow:0 18px 44px rgba(31,38,135,.3),inset 0 1px 0 rgba(255,255,255,.95);
    z-index:99;max-width:86vw;text-align:center;
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #top{
    position:fixed;right:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:16px;
    background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(255,255,255,.45));
    border:1px solid rgba(255,255,255,.8);color:var(--ink2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:80;
    opacity:0;pointer-events:none;transform:translateY(12px);
    transition:all .28s;box-shadow:0 10px 26px rgba(31,38,135,.22),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  }
  #top.show{opacity:1;pointer-events:auto;transform:none}
  #top:hover{color:#1d4ed8;transform:translateY(-2px)}
  #top svg{width:18px;height:18px}

  footer{border-top:1px solid rgba(255,255,255,.5);margin-top:60px;padding:26px 0 calc(12px + env(safe-area-inset-bottom));color:rgba(255,255,255,.85);font-size:12px;text-align:center;font-weight:500;text-shadow:0 1px 3px rgba(5,12,32,.55)}
  footer b{color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(5,12,32,.6)}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    footer b{background:linear-gradient(135deg,#ffffff,#dce9ff 60%,#f0e2ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 1px 2px rgba(5,12,32,.6);font-weight:800}
  }
  footer a{color:#fff;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.6);transition:color .2s}
  footer a:hover{color:#dbe9ff}
  .kbd{
    display:inline-block;padding:1px 7px;border:1px solid rgba(255,255,255,.75);border-bottom-width:2px;
    border-radius:6px;font-size:11px;color:#fff;margin-left:9px;background:rgba(10,20,46,.35);font-weight:600;
  }

  /* ================= responsive ================= */
  @media (max-width:820px){
    .wrap{padding:0 14px 96px}
    header{padding:26px 0 8px;gap:12px}
    .logo{width:49px;height:49px;font-size:19px;border-radius:16px}
    .brand h1{font-size:24px;line-height:1.16}
    .brand p{font-size:12px;margin-top:5px}
    .cnt{padding:7px 14px}
    .cnt b{font-size:18px}
    .cnt span{font-size:9px}
    .controls{margin-top:22px;padding:13px;border-radius:22px;gap:12px}
    .search-row button{padding:0 20px}
    .search-wrap input{padding:13px 16px 13px 44px;font-size:16px}
    .controls-row{flex-direction:column;align-items:stretch;gap:10px}
    .ctl{width:100%}
    .ctl .label{width:46px;flex:none}
    .seg{flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    .seg::-webkit-scrollbar{display:none}
    .seg button{padding:7px 11px;font-size:12px;min-height:31px}
    select.ctl-sel{flex:1;min-width:0}
    /* 手机端固定一行 4 个图标 */
    .grid{grid-template-columns:repeat(4,1fr);gap:9px}
    .card{border-radius:18px}
    .icon-box{padding:7px 7px 0}
    .info{padding:7px 7px 2px}
    .info h3{font-size:11px;line-height:1.25}
    .info .artist{display:none}
    .info .meta{font-size:9px;margin-top:3px}
    .actions{padding:6px 7px 9px;gap:5px}
    .actions .btn-dl{font-size:10.5px;padding:7px 0;border-radius:9px;letter-spacing:0}
    .actions .btn-link{width:27px;min-width:27px;border-radius:9px}
    .actions .btn-link svg{width:12px;height:12px}
    .status{margin:16px 2px 12px}
    .sk{border-radius:18px}
    .sk .s-ic{margin:7px 7px 0}
    .sk .s-l1{height:8px;margin:8px 7px 0;width:70%}
    .sk .s-l2{display:none}
    .sk .s-btn{height:29px;margin:8px 7px 9px}
    .o1{width:160px;height:160px}.o2{width:110px;height:110px}
    .o3{width:80px;height:80px}.o4{display:none}
  }
  @media (max-width:380px){
    .grid{grid-template-columns:repeat(4,1fr);gap:8px}
    .wrap{padding:0 10px 96px}
    .brand p{display:none}
    .search-row button{width:68px;padding:0}
  }

  @supports not ((backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px))){
    .glass,.cnt,.logo,.seg,.search-wrap input,select.ctl-sel,.empty,#toast,#top,.actions .btn-link{background-color:rgba(255,255,255,.85)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="bg">
  <div class="mesh m1"></div><div class="mesh m2"></div><div class="mesh m3"></div><div class="mesh m4"></div><div class="mesh m5"></div>
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
</div>
<div class="spot" id="spot"></div>
<div class="noise"></div>

<div class="wrap">
  <header>
    <div class="logo"><span>甜</span></div>
    <div class="brand">
      <h1>小甜甜图标工具</h1>
      <p>App Store 高清图标免费下载 · 支持 iOS / iPadOS / macOS<span class="kbd">/ 快速聚焦搜索</span></p>
    </div>
    <div class="cnt"><b id="total">–</b><span>RESULTS</span></div>
  </header>

  <main>
    <section class="controls glass">
      <div class="search-row">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="term" type="search" placeholder="搜索 App，例如：微信、Telegram、Notion…" autocomplete="off">
        </div>
        <button id="go">搜索</button>
      </div>
      <div class="controls-row">
        <div class="ctl">
          <span class="label">平台</span>
          <div class="seg" id="platform-seg" role="group" aria-label="平台"><div class="seg-ind"></div></div>
        </div>
        <div class="ctl">
          <span class="label">地区</span>
          <select id="region" class="ctl-sel" aria-label="地区"></select>
        </div>
        <div class="ctl">
          <span class="label">样式</span>
          <div class="seg" id="style-seg" role="group" aria-label="样式"><div class="seg-ind"></div></div>
        </div>
        <div class="ctl">
          <span class="label">格式</span>
          <div class="seg" id="format-seg" role="group" aria-label="格式"><div class="seg-ind"></div></div>
        </div>
        <div class="ctl">
          <span class="label">尺寸</span>
          <div class="seg" id="size-seg" role="group" aria-label="尺寸"><div class="seg-ind"></div></div>
        </div>
      </div>
    </section>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">输入关键词开始搜索</span>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <b>小甜甜图标工具</b> · 数据来自 <a href="https://developer.apple.com/library/archive/documentation/AudioVideo/Conceptual/iTuneSearchAPI/index.html" target="_blank" rel="noopener">Apple iTunes Search API</a>，图标版权归各开发者所有，仅供个人学习使用。
  </footer>
</div>

<button id="top" aria-label="回到顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
<div id="toast"></div>

<script>
(function(){
  'use strict';

  var state = {
    term: '微信',
    platform: 'software',
    region: 'CN',
    style: 'official',
    format: 'png',
    size: 512
  };

  var REGIONS = [
    ['CN','中国大陆'],['US','美国'],['JP','日本'],['KR','韩国'],['TW','中国台湾'],
    ['HK','中国香港'],['SG','新加坡'],['GB','英国'],['FR','法国'],['DE','德国'],
    ['IT','意大利'],['ES','西班牙'],['RU','俄罗斯'],['IN','印度'],['TH','泰国'],
    ['ID','印度尼西亚'],['PH','菲律宾']
  ];
  var PLATFORMS = [['software','iOS'],['ipadSoftware','iPadOS'],['macSoftware','macOS']];
  var STYLES = [['official','官方'],['normal','常规'],['rounded','圆角'],['original','原始']];
  var FORMATS = [['jpg','JPEG'],['png','PNG'],['webp','WebP']];
  var SIZES = [256,512,1024];

  var $ = function(s, el){ return (el || document).querySelector(s); };
  var termEl = $('#term'), goEl = $('#go'), gridEl = $('#grid'),
      statusEl = $('#status-text'), dotEl = $('#dot'),
      totalEl = $('#total'), toastEl = $('#toast'), topBtn = $('#top');

  var currentResults = [];
  var segBoxes = [];
  var finePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

  /* ---------- segmented controls with springy sliding indicator ---------- */
  function moveIndicator(box, btn){
    var ind = box.querySelector('.seg-ind');
    if (!ind || !btn) return;
    var boxRect = box.getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    ind.style.width = btnRect.width + 'px';
    ind.style.transform = 'translateX(' + (btnRect.left - boxRect.left) + 'px)';
  }

  function buildSeg(containerId, list, key, onChange){
    var box = $('#' + containerId);
    segBoxes.push(box);
    list.forEach(function(item){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = item[1];
      btn.dataset.value = item[0];
      if (item[0] === state[key]) btn.classList.add('on');
      btn.addEventListener('click', function(){
        state[key] = item[0];
        box.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        moveIndicator(box, btn);
        onChange && onChange(key);
      });
      box.appendChild(btn);
    });
    var active = box.querySelector('button.on');
    requestAnimationFrame(function(){ moveIndicator(box, active); });
  }

  function buildRegion(){
    var sel = $('#region');
    REGIONS.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r[0];
      opt.textContent = r[1] + ' (' + r[0] + ')';
      sel.appendChild(opt);
    });
    sel.value = state.region;
    sel.addEventListener('change', function(){ state.region = sel.value; runSearch(); });
  }

  /* ---------- helpers ---------- */
  function artworkUrl(url, size, format){
    if (!url) return '';
    var ext = (format === 'webp') ? 'webp' : format;
    return url.replace(/(\/\d+x\d+)(?:bb)?\.(?:jpg|png|webp)/i, '/' + size + 'x' + size + 'bb.' + ext);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function sanitizeName(s){
    return String(s).replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'icon';
  }

  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function setLoading(on){
    dotEl.classList.toggle('on', on);
  }

  /* ---------- download ---------- */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function downloadIcon(url, filename){
    if (navigator.vibrate) navigator.vibrate(12);
    if (isIOS){
      toast('已为你打开高清原图，长按图片即可保存');
      window.open(url, '_blank');
      return;
    }
    toast('正在下载…');
    fetch(url, { mode: 'cors', credentials: 'omit' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function(blob){
        var objectUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 4000);
        toast('已开始下载 ' + filename);
      })
      .catch(function(){
        toast('直接下载失败，已在新窗口打开原图');
        window.open(url, '_blank', 'noopener');
      });
  }

  /* ---------- render ---------- */
  function skeleton(count){
    var s = '';
    for (var i = 0; i < count; i++){
      s += '<div class="sk"><div class="s-ic"></div><div class="s-l1"></div><div class="s-l2"></div><div class="s-btn"></div></div>';
    }
    gridEl.innerHTML = s;
  }

  function renderGrid(results){
    currentResults = results;
    totalEl.textContent = results.length;
    if (!results.length){
      gridEl.innerHTML = '<div class="empty"><div class="em">🔍</div><b>没有找到相关 App</b>换个关键词，或切换平台 / 地区试试</div>';
      return;
    }
    var html = results.map(function(r, i){
      var name = esc(r.trackName || '未知 App');
      var artist = esc(r.artistName || '');
      var genre = esc(r.primaryGenreName || '');
      var rating = r.averageUserRating ? '<span class="star">★</span> ' + Number(r.averageUserRating).toFixed(1) : '';
      var meta = [genre, rating].filter(Boolean).join(' · ');
      var preview = artworkUrl(r.artworkUrl100 || r.artworkUrl512, 256, 'jpg');
      var full = artworkUrl(r.artworkUrl100 || r.artworkUrl512, state.size, state.format);
      var file = sanitizeName(r.trackName) + '-' + state.size + 'px.' + state.format;
      var link = r.trackViewUrl ? ' href="' + esc(r.trackViewUrl) + '" target="_blank" rel="noopener"' : '';
      return '' +
        '<article class="card" style="--i:' + i + '">' +
          '<div class="icon-box st-' + state.style + '"><img loading="lazy" src="' + preview + '" alt="' + name + '"></div>' +
          '<div class="info">' +
            '<h3 title="' + name + '">' + name + '</h3>' +
            '<p class="artist" title="' + artist + '">' + artist + '</p>' +
            '<p class="meta">' + (meta || '&nbsp;') + '</p>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn-dl" type="button" data-url="' + esc(full) + '" data-file="' + esc(file) + '">下载图标</button>' +
            '<a class="btn-link"' + link + ' aria-label="在 App Store 中查看">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>' +
            '</a>' +
          '</div>' +
        '</article>';
    }).join('');
    gridEl.innerHTML = html;
  }

  function onDownloadClick(e){
    var btn = e.target.closest('.btn-dl');
    if (!btn) return;
    downloadIcon(btn.dataset.url, btn.dataset.file);
  }

  /* ---------- search ---------- */
  function runSearch(){
    var term = termEl.value.trim();
    if (!term){ toast('请输入关键词'); return; }
    state.term = term;
    setLoading(true);
    statusEl.textContent = '正在搜索「' + term + '」…';
    totalEl.textContent = '…';
    skeleton(10);

    var q = new URLSearchParams({
      term: term,
      country: state.region,
      entity: state.platform,
      media: 'software',
      limit: '50'
    });

    fetch('https://itunes.apple.com/search?' + q.toString(), { mode: 'cors' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){
        var results = (data.results || []).filter(function(r){ return r.artworkUrl100 || r.artworkUrl512; });
        statusEl.textContent = '找到 ' + data.resultCount + ' 个结果，展示前 ' + results.length + ' 个';
        renderGrid(results);
      })
      .catch(function(err){
        console.error(err);
        statusEl.textContent = '搜索失败，请检查网络后重试';
        gridEl.innerHTML = '<div class="empty"><div class="em">⚠️</div><b>加载失败</b>网络似乎开小差了，稍后再试试</div>';
        totalEl.textContent = '–';
      })
      .finally(function(){ setLoading(false); });
  }

  /* ---------- effects: cursor spotlight ---------- */
  if (finePointer){
    var spot = $('#spot');
    var raf = null;
    document.addEventListener('mousemove', function(e){
      if (raf) return;
      raf = requestAnimationFrame(function(){
        spot.style.background = 'radial-gradient(560px circle at ' + e.clientX + 'px ' + e.clientY + 'px, rgba(255,255,255,.32), transparent 65%)';
        raf = null;
      });
    }, { passive: true });
  }

  /* ---------- effects: 3D tilt on cards ---------- */
  if (finePointer){
    gridEl.addEventListener('mouseover', function(e){
      var card = e.target.closest('.card');
      if (card) card.style.transitionDuration = '.08s';
    });
    gridEl.addEventListener('mousemove', function(e){
      var card = e.target.closest('.card');
      if (!card) return;
      var r = card.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - .5;
      var py = (e.clientY - r.top) / r.height - .5;
      card.style.transform = 'perspective(950px) rotateX(' + (-py * 7).toFixed(2) + 'deg) rotateY(' + (px * 7).toFixed(2) + 'deg) translateY(-5px)';
    }, { passive: true });
    gridEl.addEventListener('mouseout', function(e){
      var card = e.target.closest('.card');
      if (card){
        card.style.transform = '';
        card.style.transitionDuration = '';
      }
    });
  }

  /* ---------- misc ---------- */
  window.addEventListener('resize', function(){
    segBoxes.forEach(function(box){
      var active = box.querySelector('button.on');
      if (active) moveIndicator(box, active);
    });
  });

  window.addEventListener('scroll', function(){
    topBtn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
  topBtn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      termEl.focus();
    }
  });

  /* ---------- init ---------- */
  buildSeg('platform-seg', PLATFORMS, 'platform', function(key){
    if (key === 'platform') runSearch();
  });
  buildRegion();
  buildSeg('style-seg', STYLES, 'style', function(){ renderGrid(currentResults); });
  buildSeg('format-seg', FORMATS, 'format', function(){ renderGrid(currentResults); });
  buildSeg('size-seg', SIZES, 'size', function(){ renderGrid(currentResults); });

  termEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') runSearch();
  });
  goEl.addEventListener('click', runSearch);
  gridEl.addEventListener('click', onDownloadClick);

  termEl.value = state.term;
  runSearch();
})();
</script>
</body>
</html>
