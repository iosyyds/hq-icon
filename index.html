  }

  function buildSeg(containerId, list, key, onChange){
    var box = $('#' + containerId);
    segBoxes.push(box);
    list.forEach(function(item){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = item[1];
      btn.dataset.value = item[0];
      if (item[0] === state[key]) btn.classList.add('on');
      btn.addEventListener('click', function(){
        state[key] = item[0];
        box.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        moveIndicator(box, btn);
        onChange && onChange(key);
      });
      box.appendChild(btn);
    });
    var active = box.querySelector('button.on');
    requestAnimationFrame(function(){ moveIndicator(box, active); });
  }

  function buildRegion(){
    var sel = $('#region');
    REGIONS.forEach(function(r){
      var opt = document.createElement('option');
      opt.value = r[0];
      opt.textContent = r[1] + ' (' + r[0] + ')';
      sel.appendChild(opt);
    });
    sel.value = state.region;
    sel.addEventListener('change', function(){ state.region = sel.value; runSearch(); });
  }

  /* ---------- helpers ---------- */
  function artworkUrl(url, size, format){
    if (!url) return '';
    var ext = (format === 'webp') ? 'webp' : format;
    return url.replace(/(\/\d+x\d+)(?:bb)?\.(?:jpg|png|webp)/i, '/' + size + 'x' + size + 'bb.' + ext);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function sanitizeName(s){
    return String(s).replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'icon';
  }

  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  function setLoading(on){
    dotEl.classList.toggle('on', on);
  }

  /* ---------- download ---------- */
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function downloadIcon(url, filename){
    if (navigator.vibrate) navigator.vibrate(12);
    if (isIOS){
      toast('已为你打开高清原图，长按图片即可保存');
      window.open(url, '_blank');
      return;
    }
    toast('正在下载…');
    fetch(url, { mode: 'cors', credentials: 'omit' })
      .then(function(res){
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      })
      .then(function(blob){
        var objectUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(objectUrl); }, 4000);
        toast('已开始下载 ' + filename);
      })
      .catch(function(){
        toast('直接下载失败，已在新窗口打开原图');
        window.open(url, '_blank', 'noopener');
      });
  }

  /* ---------- render ---------- */
  function skeleton(count){
    var s = '';
    for (var i = 0; i < count; i++){
      s += '<div class="sk"><div class="s-ic"></div><div class="s-l1"></div><div class="s-l2"></div><div class="s-btn"></div></div>';
    }
    gridEl.innerHTML = s;
  }

  function renderGrid(results){
    currentResults = results;
    totalEl.textContent = results.length;
    if (!results.length){
      gridEl.innerHTML = '<div class="empty"><div class="em">🔍</div><b>没有找到相关 App</b>换个关键词，或切换平台 / 地区试试</div>';
      return;
    }
    var html = results.map(function(r, i){
      var name = esc(r.trackName || '未知 App');
      var artist = esc(r.artistName || '');
      var genre = esc(r.primaryGenreName || '');
      var rating = r.averageUserRating ? '<span class="star">★</span> ' + Number(r.averageUserRating).toFixed(1) : '';
      var meta = [genre, rating].filter(Boolean).join(' · ');
      var preview = artworkUrl(r.artworkUrl100 || r.artworkUrl512, 256, 'jpg');
      var full = artworkUrl(r.artworkUrl100 || r.artworkUrl512, state.size, state.format);
      var file = sanitizeName(r.trackName) + '-' + state.size + 'px.' + state.format;
      var link = r.trackViewUrl ? ' href="' + esc(r.trackViewUrl) + '" target="_blank" rel="noopener"' : '';
      return '' +
        '<article class="card" style="--i:' + i + '">' +
          '<div class="icon-box st-' + state.style + '"><img loading="lazy" src="' + preview + '" alt="' + name + '"></div>' +
          '<div class="info">' +
            '<h3 title="' + name + '">' + name + '</h3>' +
            '<p class="artist" title="' + artist + '">' + artist + '</p>' +
            '<p class="meta">' + (meta || '&nbsp;') + '</p>' +
          '</div>' +
          '<div class="actions">' +
            '<button class="btn-dl" type="button" data-url="' + esc(full) + '" data-file="' + esc(file) + '">下载图标</button>' +
            '<a class="btn-link"' + link + ' aria-label="在 App Store 中查看">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>' +
            '</a>' +
          '</div>' +
        '</article>';
    }).join('');
    gridEl.innerHTML = html;
  }

  function onDownloadClick(e){
    var btn = e.target.closest('.btn-dl');
    if (!btn) return;
    downloadIcon(btn.dataset.url, btn.dataset.file);
  }

  /* ---------- search ---------- */
  function fetchWithTimeout(url, ms, tries){
    tries = tries || 1;
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, ms);
    return fetch(url, { mode: 'cors', signal: ctrl.signal })
      .then(function(res){
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .catch(function(err){
        clearTimeout(timer);
        if (tries < 2){
          statusEl.textContent = '网络波动，正在重试…';
          return fetchWithTimeout(url, ms, tries + 1);
        }
        throw err;
      });
  }

  function runSearch(){
    var term = termEl.value.trim();
    if (!term){ toast('请输入关键词'); return; }
    state.term = term;
    setLoading(true);
    statusEl.textContent = '正在搜索「' + term + '」…';
    totalEl.textContent = '…';
    skeleton(10);

    var q = new URLSearchParams({
      term: term,
      country: state.region,
      entity: state.platform,
      media: 'software',
      limit: '50'
    });

    fetchWithTimeout('https://itunes.apple.com/search?' + q.toString(), 12000)
      .then(function(data){
        var results = (data.results || []).filter(function(r){ return r.artworkUrl100 || r.artworkUrl512; });
        statusEl.textContent = '找到 ' + data.resultCount + ' 个结果，展示前 ' + results.length + ' 个';
        renderGrid(results);
      })
      .catch(function(err){
        console.error(err);
        statusEl.textContent = '搜索失败，请检查网络后重试';
        gridEl.innerHTML = '<div class="empty"><div class="em">⚠️</div><b>加载失败</b>网络似乎开小差了，点击下方按钮重试</div>';
        totalEl.textContent = '–';
      })
      .finally(function(){ setLoading(false); });
  }

  /* ---------- misc ---------- */
  window.addEventListener('resize', function(){
    segBoxes.forEach(function(box){
      var active = box.querySelector('button.on');
      if (active) moveIndicator(box, active);
    });
  });

  window.addEventListener('scroll', function(){
    topBtn.classList.toggle('show', window.scrollY > 600);
  }, { passive: true });
  topBtn.addEventListener('click', function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); });

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      termEl.focus();
    }
  });

  /* ---------- init ---------- */
  buildSeg('platform-seg', PLATFORMS, 'platform', function(key){
    if (key === 'platform') runSearch();
  });
  buildRegion();
  buildSeg('style-seg', STYLES, 'style', function(){ renderGrid(currentResults); });
  buildSeg('format-seg', FORMATS, 'format', function(){ renderGrid(currentResults); });
  buildSeg('size-seg', SIZES, 'size', function(){ renderGrid(currentResults); });

  termEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') runSearch();
  });
  goEl.addEventListener('click', runSearch);
  gridEl.addEventListener('click', onDownloadClick);

  termEl.value = state.term;
  runSearch();
})();
</script>
</body>
</html>
